name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v0.3.0). Required.
        required: true
        type: string
      publish_pypi:
        description: Publish to PyPI. Disable to only create/update the GitHub release.
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: PyPI
    steps:
      - name: Validate release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag must start with v (got '$tag')"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          notes="--generate-notes"
          if [ -f "docs/releases/${tag}.md" ]; then
            notes="--notes-file docs/releases/${tag}.md"
          else
            git fetch --depth=1 origin main || true
            if git cat-file -e "origin/main:docs/releases/${tag}.md" 2>/dev/null; then
              git show "origin/main:docs/releases/${tag}.md" > /tmp/assaystone-release-notes.md
              notes="--notes-file /tmp/assaystone-release-notes.md"
            fi
          fi
          gh release create "$tag" dist/* --title "$tag" $notes
