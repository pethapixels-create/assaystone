name: Assaystone
description: Verify recorded AI agent traces with acceptance contracts and annotate the job.
author: Assaystone contributors
branding:
  icon: check-circle
  color: green

outputs:
  verdict:
    description: Overall verdict: pass, fail, or escalate.
    value: ${{ steps.verify.outputs.verdict }}
  findings:
    description: Number of failed or escalated verifier verdicts.
    value: ${{ steps.verify.outputs.findings }}
  traces:
    description: Number of traces evaluated.
    value: ${{ steps.verify.outputs.traces }}

inputs:
  contract:
    description: Path to the acceptance contract JSON file.
    required: true
  traces:
    description: Trace file or directory of trace JSON files.
    required: true
  baseline:
    description: Path to the baseline repository.
    required: false
    default: "."
  python-version:
    description: Python version used to run Assaystone.
    required: false
    default: "3.11"
  install:
    description: Optional pip install spec, for example "assaystone==0.5.0". Defaults to installing this action's repository.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Assaystone
      shell: bash
      run: |
        if [ -n "${{ inputs.install }}" ]; then
          python -m pip install "${{ inputs.install }}"
        else
          repo="${{ github.action_repository }}"
          ref="${{ github.action_ref }}"
          if [ -z "$repo" ]; then
            repo="${{ github.repository }}"
            ref="${{ github.sha }}"
          fi
          python -m pip install "assaystone @ git+https://github.com/${repo}@${ref}"
        fi
    - name: Verify agent traces
      id: verify
      shell: bash
      run: |
        assaystone verify \
          --contract "${{ inputs.contract }}" \
          --trace "${{ inputs.traces }}" \
          --baseline "${{ inputs.baseline }}" \
          --github
